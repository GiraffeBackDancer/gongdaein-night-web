<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공대인의 밤</title>
    <style>
        /* ===== 폰트: fonts 폴더의 갈무리 ===== */
        @font-face {
            font-family: "Galmuri11";
            src: url("fonts/Galmuri11.woff2") format("woff2");
            font-display: block;
        }

        @font-face {
            font-family: "Galmuri11";
            src: url("fonts/Galmuri11-Bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
        }

        /* ===== 색상 ===== */
        :root {
            --bg: #141824;
            /* 화면 바깥 */
            --bezel: #262c3d;
            /* 게임기 테두리 */
            --screen: #ffffff;
            /* 게임 화면 바탕 */
            --ink: #1b1d2a;
            /* 테두리·글씨 */
            --box: #ffffff;
            /* 대화창 */
            --accent: #e8483c;
            /* 커서·LED */
            --muted: #8a90a4;
            --pix: "Galmuri11", "Malgun Gothic", monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            padding-inline: 16px;
            background: var(--bg);
            color: var(--screen);
            font-family: var(--pix);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ===== 게임기 ===== */
        .console {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-block: 20px;
        }

        .bezel {
            background: var(--bezel);
            border-radius: 14px 14px 40px 14px;
            padding: 18px 18px 22px;
            box-shadow: 0 0 0 2px #0c0f18, 0 18px 40px rgba(0, 0, 0, .45);
        }

        .bezel-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 11px;
            letter-spacing: .12em;
            color: var(--muted);
        }

        .led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        /* ===== 게임 화면 ===== */
        .screen {
            position: relative;
            width: 100%;
            aspect-ratio: 10 / 9;
            overflow: hidden;
            background: var(--screen);
            border: 3px solid #0c0f18;
            cursor: pointer;
            outline: none;
        }

        .screen:focus-visible {
            box-shadow: 0 0 0 3px var(--accent);
        }

        .screen::after {
            /* 옛날 화면 느낌의 스캔라인 */
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .035) 0 2px, transparent 2px 4px);
        }

        /* ===== 캐릭터 영역 ===== */
        .stage {
            position: absolute;
            inset: 0 0 34%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 4%;
        }

        #sprite,
        #charImg {
            position: relative;
            height: 78%;
            max-width: 90%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            /* 도트가 뭉개지지 않게 */
        }

        /* 박사 이미지 위치 미세 조정: 숫자가 클수록 아래로 내려감 */
        #charImg {
            transform: translateY(6%);
        }

        .floor {
            position: absolute;
            left: 30%;
            right: 30%;
            bottom: 3%;
            height: 5%;
            border-radius: 50%;
            background: rgba(27, 29, 42, .12);
        }

        /* ===== 대화창 (이중 테두리) ===== */
        .dialog {
            position: absolute;
            left: 3%;
            right: 3%;
            bottom: 3%;
            height: 29%;
            display: flex;
            align-items: center;
            padding: 4.2% 6%;
            background: var(--box);
            color: var(--ink);
            border: 4px solid var(--ink);
            border-radius: 6px;
            box-shadow: inset 0 0 0 3px var(--box), inset 0 0 0 5px var(--ink);
        }

        #line {
            margin: 0;
            min-height: 3.2em;
            font-size: clamp(14px, 3.9vw, 20px);
            line-height: 1.6;
            word-break: keep-all;
        }

        .next {
            /* 깜빡이는 ▼ */
            position: absolute;
            right: 5%;
            bottom: 10%;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 9px solid var(--accent);
            animation: bob .7s steps(2) infinite;
        }

        @keyframes bob {
            50% {
                transform: translateY(4px);
            }
        }

        /* ===== YES / NO 선택창 ===== */
        .menu {
            position: absolute;
            right: 3%;
            bottom: 34%;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 10px;
            background: var(--box);
            color: var(--ink);
            border: 4px solid var(--ink);
            border-radius: 6px;
            box-shadow: inset 0 0 0 3px var(--box), inset 0 0 0 5px var(--ink);
            animation: pop .12s steps(2);
        }

        @keyframes pop {
            from {
                transform: scale(.6);
                opacity: 0;
            }
        }

        .menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px 8px 6px;
            font: inherit;
            font-size: clamp(15px, 4vw, 20px);
            letter-spacing: .05em;
            text-align: left;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer;
        }

        .menu button::before {
            /* 선택 커서 ▶ 자리 */
            content: "";
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 8px solid transparent;
        }

        .menu button.on::before {
            border-left-color: var(--ink);
        }

        .menu button:focus-visible {
            outline: 2px dashed var(--accent);
            outline-offset: -2px;
        }

        /* ===== 섬광 & 임시 화면 ===== */
        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
        }

        .flash.go {
            animation: flash 1.1s steps(6) forwards;
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            35% {
                opacity: .2;
            }

            50%,
            100% {
                opacity: 1;
            }
        }

        .end {
            position: absolute;
            inset: 0;
            padding: 0 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            background: var(--screen);
            color: var(--ink);
        }

        .end h1 {
            margin: 0;
            font-size: clamp(22px, 6vw, 32px);
            letter-spacing: .04em;
            text-wrap: balance;
        }

        .end p {
            margin: 0;
            font-size: 13px;
            line-height: 1.7;
            color: #5a6076;
        }

        .end button {
            font: inherit;
            font-size: 14px;
            padding: 10px 16px;
            background: var(--ink);
            color: var(--screen);
            border: 0;
            border-radius: 3px;
            cursor: pointer;
        }

        /* ===== 하단 안내 ===== */
        .pad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: var(--muted);
        }

        .pad button {
            font: inherit;
            font-size: 12px;
            color: var(--muted);
            background: none;
            border: 1px solid #3a4258;
            border-radius: 999px;
            padding: 6px 12px;
            cursor: pointer;
        }

        .pad button:focus-visible {
            outline: 2px solid var(--accent);
        }

        /* 움직임 줄이기 설정을 켠 사용자 배려 */
        @media (prefers-reduced-motion: reduce) {

            .next,
            .menu,
            .flash.go {
                animation: none;
            }

            .flash.go {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="console">
        <!-- 게임기 테두리 -->
        <div class="bezel">
            <div class="bezel-top"><span class="led"></span>ENGINEERING NIGHT · 12.03</div>

            <!-- 게임 화면: 누르면 대사 넘김 -->
            <div class="screen" id="screen" tabindex="0" role="button" aria-label="대화 넘기기">

                <!-- 캐릭터 영역 -->
                <div class="stage">
                    <div class="floor"></div>
                    <img id="charImg" alt="박사" hidden>
                    <canvas id="sprite" width="22" height="30" aria-label="박사"></canvas>
                </div>

                <!-- 대화창 -->
                <div class="dialog">
                    <p id="line" aria-live="polite"></p>
                    <span class="next" id="next" hidden></span>
                </div>

                <!-- YES / NO 선택창 -->
                <div class="menu" id="menu" role="menu" hidden>
                    <button id="yes" role="menuitem" class="on">YES</button>
                    <button id="no" role="menuitem">NO</button>
                </div>

                <!-- YES 선택 시 섬광 -->
                <div class="flash" id="flash"></div>

                <!-- 홈페이지 연결 전 임시 화면 -->
                <div class="end" id="end" hidden>
                    <h1>모험을 시작하지!</h1>
                    <p>여기서 공대인의 밤 홈페이지로 이동합니다.<br>(홈페이지 연결 전 임시 화면)</p>
                    <button id="again">처음부터 다시 보기</button>
                </div>
            </div>
        </div>

        <!-- 조작 안내 + 효과음 버튼 -->
        <div class="pad">
            <span>화면을 누르거나 SPACE · ↑↓ ENTER</span>
            <button id="snd" aria-pressed="false">효과음 켜기</button>
        </div>
    </div>
    <script>
        /* ===================== 설정 ===================== */
        const HOME_URL = "";        // YES 선택 시 이동할 홈페이지 주소 (비우면 임시 화면)
        const CHARACTER_IMG = "assets/character.png";

        const $ = (id) => document.getElementById(id);

        /* ===================== 캐릭터 ===================== */
        // 기본 도트 캐릭터: 안전모·고글·작업복을 입은 공대 박사
        // 글자 하나 = 픽셀 하나, 점(.)은 투명
        const PAL = {
            K: "#1b1d2a", Y: "#f4c430", y: "#c8961e", H: "#a7adb8", S: "#f2c29b", s: "#d49a74",
            G: "#7fd6e8", g: "#ffffff", W: "#eef0f4", B: "#2f4d8f", b: "#20366a", O: "#ff7a2f",
            P: "#3b3d4a", N: "#1b1d2a", M: "#b8c0cc", m: "#7c8494"
        };

        const MAP = [
            ".......KKKKKKKK",
            ".....KKYYYYYYYYKK",
            "....KYYYYyYYYYYYyK",
            "....KYYYYyYYYYYYyK",
            "...KKKKKKKKKKKKKKKK",
            "....KHSSSSSSSSSSHK",
            "....KKKKKKSSKKKKKK",
            "....KKGgGKSSKGgGKK",
            "....KKGGGKSSKGGGKK",
            "....KSKKKKssKKKKsK",
            "....KSSSSSSSSSSSsK",
            "....KSSSSKKKKSSSsK",
            ".....KSSSSSSSSSsK",
            "......KKSSSSSSKK",
            ".....KKBBWWWWBBKK",
            "....KBBBBBWWBBBBBK",
            "...KBBBBBBWWBBBBBbK",
            "...KBBBBBBBBBBBBBbK",
            "...KOOOOOOOOOOOOOOK",
            "...KBBBBBBBBBBBBBbK",
            "...KSKBBBBBBBBBBKSK",
            "...KKKBBBBBBBBBBKKK",
            ".....KPPPPPPPPPPK",
            ".....KPPPPKKPPPPK",
            ".....KPPPPKKPPPPK",
            ".....KPPPPKKPPPPK",
            "....KNNNNNK.KNNNNNK",
            "....KKKKKKK.KKKKKKK"
        ];
        // 오른손에 든 스패너 [x, y, 색]
        const WRENCH = [[19, 14, "M"], [21, 14, "M"], [19, 15, "M"], [20, 15, "M"], [21, 15, "M"], [20, 16, "M"],
        [20, 17, "m"], [20, 18, "m"], [20, 19, "M"], [20, 20, "M"]];

        // 기본 도트 캐릭터 그리기
        function drawDots() {
            const ctx = $("sprite").getContext("2d");
            MAP.forEach((row, y) => [...row].forEach((ch, x) => {
                if (PAL[ch]) { ctx.fillStyle = PAL[ch]; ctx.fillRect(x, y, 1, 1); }
            }));
            WRENCH.forEach(([x, y, ch]) => { ctx.fillStyle = PAL[ch]; ctx.fillRect(x, y, 1, 1); });
        }

        function drawCharacter() {
            drawDots();   // 대비용으로 미리 그려만 둠
            if (!CHARACTER_IMG) return;   // 이미지 설정이 없으면 도트 캐릭터 그대로

            const img = $("charImg"), sprite = $("sprite");
            sprite.hidden = true;                             // 불러오는 동안은 아무것도 안 보이게
            img.onload = () => { img.hidden = false; };       // 성공 → 이미지 표시
            img.onerror = () => { sprite.hidden = false; };   // 실패(파일 없음) → 도트 캐릭터 표시
            img.src = CHARACTER_IMG;
        }
        drawCharacter();

        /* ===================== 대사 ===================== */
        const INTRO = [
            "공대인인가? 잘 왔네!",
            "우리는 12월 3일, 함께 모험을 떠날 친구들을 모으고 있어.",
            "이번 공대인의 밤에 함께 할텐가?"
        ];
        const NO_LINE = "다시 한번 생각해보시게....";
        const QUESTION = INTRO[INTRO.length - 1];   // 마지막 대사 = 질문 (NO 이후 다시 물어볼 때 사용)
        const TYPE_SPEED = 45;   // 글자 하나가 찍히는 간격(ms). 작을수록 빠름

        const lineEl = $("line"), nextEl = $("next");


        let timer = null;      // 타이핑 타이머
        let full = "";         // 지금 찍고 있는 대사 전체
        let typing = false;    // 타이핑 중인지
        let typeDone = null;   // 타이핑이 끝나면 실행할 함수
        let pending = null;    // ▼ 상태에서 화면을 누르면 실행할 함수
        let state = "talk";    // talk: 대사 중 / menu: 선택 중 / done: 끝

        // 한 줄을 한 글자씩 찍기
        function type(text, done) {
            clearInterval(timer);
            full = text; typeDone = done; typing = true; pending = null;
            nextEl.hidden = true;
            lineEl.textContent = "";


            let i = 0;
            timer = setInterval(() => {
                lineEl.textContent = text.slice(0, ++i);
                if (i >= text.length) finishType();
            }, TYPE_SPEED);
        }

        // 타이핑 끝내기 (끝까지 찍었을 때 + 중간에 눌러서 건너뛸 때 둘 다 여기로)
        function finishType() {
            clearInterval(timer);
            lineEl.textContent = full;
            typing = false;
            const d = typeDone; typeDone = null;
            if (d) d();
        }

        // ▼를 띄우고, 누르면 fn 실행
        function waitThen(fn) { nextEl.hidden = false; pending = fn; }

        // 여러 줄을 차례로: 한 줄 끝 → ▼ → 누르면 다음 줄 → 마지막 줄이 끝나면 onEnd
        function say(lines, onEnd) {
            const [first, ...rest] = lines;
            type(first, () => rest.length ? waitThen(() => say(rest, onEnd)) : onEnd());
        }

        // 화면을 눌렀을 때: 타이핑 중이면 한 번에 다 보여주고, ▼ 상태면 다음 줄로
        function advance() {
            if (state !== "talk") return;
            if (typing) { finishType(); return; }
            if (pending) { const p = pending; pending = null; p(); }
        }

        function runIntro() {
            state = "talk";
            menu.hidden = true;           // 선택창 닫기
            $("end").hidden = true;       // 임시 화면 닫기
            $("flash").className = "flash";   // 섬광 초기화
            say(INTRO, onIntroEnd);
        }
        function onIntroEnd() { openMenu(); }

        /* ===================== YES / NO ===================== */
        const menu = $("menu"), yes = $("yes"), no = $("no");
        let sel = 0;   // 0: YES, 1: NO

        function openMenu() {
            state = "menu";
            menu.hidden = false;
            setSel(0);
            yes.focus({ preventScroll: true });
        }

        // ▶ 커서 위치 바꾸기
        function setSel(i) {
            sel = i;
            yes.classList.toggle("on", i === 0);
            no.classList.toggle("on", i === 1);
        }

        function choose(i) {
            if (state !== "menu") return;   // 두 번 눌림 방지
            menu.hidden = true;
            if (i === 0) {
                // YES → 대사 → 흰 섬광 → 홈페이지로 이동
                state = "done";
                nextEl.hidden = true;
                lineEl.textContent = "좋아! 모험을 떠나 보자!";
                $("flash").classList.add("go");
                setTimeout(() => {
                    if (HOME_URL) {
                        location.href = HOME_URL;          // 주소가 있으면 이동
                    } else {
                        $("end").hidden = false;           // 없으면 임시 화면
                        $("again").focus({ preventScroll: true });
                    }
                }, 1150);   // 섬광 애니메이션(1.1초)이 끝난 뒤
            } else {
                // NO → "다시 한번 생각해보시게...." → 질문 다시 → 선택창
                state = "talk";
                say([NO_LINE, QUESTION], openMenu);
            }
        }

        /* ===================== 조작 ===================== */
        $("screen").addEventListener("click", advance);

        // 버튼 클릭이 화면 클릭(advance)으로 번지지 않게 stopPropagation
        yes.addEventListener("click", (e) => { e.stopPropagation(); choose(0); });
        no.addEventListener("click", (e) => { e.stopPropagation(); choose(1); });
        // 마우스를 올리면 ▶ 커서도 따라감
        yes.addEventListener("mouseenter", () => setSel(0));
        no.addEventListener("mouseenter", () => setSel(1));
        $("again").addEventListener("click", (e) => {
            e.stopPropagation();
            runIntro();
            $("screen").focus({ preventScroll: true });
        });

        document.addEventListener("keydown", (e) => {
            // 선택창이 열려 있을 때: ↑↓로 이동, Enter/Space로 선택, Esc는 NO
            if (state === "menu") {
                if (e.key === "ArrowUp" || e.key === "ArrowDown") {
                    e.preventDefault();
                    setSel(sel ? 0 : 1);
                    (sel ? no : yes).focus({ preventScroll: true });
                } else if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    choose(sel);
                } else if (e.key === "Escape") {
                    e.preventDefault();
                    choose(1);
                }
                return;
            }
            if (e.target.tagName === "BUTTON") return;
            if (e.key === " " || e.key === "Enter") { e.preventDefault(); advance(); }
        });

        runIntro();
    </script>
</body>

</html>
