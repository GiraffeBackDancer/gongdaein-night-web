<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공대인의 밤</title>
    <style>
        /* ===== 폰트: fonts 폴더의 갈무리 ===== */
        @font-face {
            font-family: "Galmuri11";
            src: url("fonts/Galmuri11.woff2") format("woff2");
            font-display: block;
        }

        @font-face {
            font-family: "Galmuri11";
            src: url("fonts/Galmuri11-Bold.woff2") format("woff2");
            font-weight: 700;
            font-display: block;
        }

        /* ===== 색상 ===== */
        :root {
            --bg: #141824;
            /* 화면 바깥 */
            --bezel: #262c3d;
            /* 게임기 테두리 */
            --screen:  #ffffff;
            /* 게임 화면 바탕 */
            --ink: #1b1d2a;
            /* 테두리·글씨 */
            --box:  #ffffff;
            /* 대화창 */
            --accent: #e8483c;
            /* 커서·LED */
            --muted: #8a90a4;
            --pix: "Galmuri11", "Malgun Gothic", monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            padding-inline: 16px;
            background: var(--bg);
            color: var(--screen);
            font-family: var(--pix);
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ===== 게임기 ===== */
        .console {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-block: 20px;
        }

        .bezel {
            background: var(--bezel);
            border-radius: 14px 14px 40px 14px;
            padding: 18px 18px 22px;
            box-shadow: 0 0 0 2px #0c0f18, 0 18px 40px rgba(0, 0, 0, .45);
        }

        .bezel-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 11px;
            letter-spacing: .12em;
            color: var(--muted);
        }

        .led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        /* ===== 게임 화면 ===== */
        .screen {
            position: relative;
            width: 100%;
            aspect-ratio: 10 / 9;
            overflow: hidden;
            background: var(--screen);
            border: 3px solid #0c0f18;
            cursor: pointer;
            outline: none;
        }

        .screen:focus-visible {
            box-shadow: 0 0 0 3px var(--accent);
        }

        .screen::after {
            /* 옛날 화면 느낌의 스캔라인 */
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .035) 0 2px, transparent 2px 4px);
        }

        /* ===== 캐릭터 영역 ===== */
        .stage {
            position: absolute;
            inset: 0 0 34%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 4%;
        }

        #sprite,
        #charImg {
            position: relative;
            height: 78%;
            max-width: 90%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            /* 도트가 뭉개지지 않게 */
        }

        .floor {
            position: absolute;
            left: 30%;
            right: 30%;
            bottom: 3%;
            height: 5%;
            border-radius: 50%;
            background: rgba(27, 29, 42, .12);
        }

        /* ===== 대화창 (이중 테두리) ===== */
        .dialog {
            position: absolute;
            left: 3%;
            right: 3%;
            bottom: 3%;
            height: 29%;
            display: flex;
            align-items: center;
            padding: 4.2% 6%;
            background: var(--box);
            color: var(--ink);
            border: 4px solid var(--ink);
            border-radius: 6px;
            box-shadow: inset 0 0 0 3px var(--box), inset 0 0 0 5px var(--ink);
        }

        #line {
            margin: 0;
            min-height: 3.2em;
            font-size: clamp(14px, 3.9vw, 20px);
            line-height: 1.6;
            word-break: keep-all;
        }

        .next {
            /* 깜빡이는 ▼ */
            position: absolute;
            right: 5%;
            bottom: 10%;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 9px solid var(--accent);
            animation: bob .7s steps(2) infinite;
        }

        @keyframes bob {
            50% {
                transform: translateY(4px);
            }
        }

        /* ===== YES / NO 선택창 ===== */
        .menu {
            position: absolute;
            right: 3%;
            bottom: 34%;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 10px;
            background: var(--box);
            color: var(--ink);
            border: 4px solid var(--ink);
            border-radius: 6px;
            box-shadow: inset 0 0 0 3px var(--box), inset 0 0 0 5px var(--ink);
            animation: pop .12s steps(2);
        }

        @keyframes pop {
            from {
                transform: scale(.6);
                opacity: 0;
            }
        }

        .menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px 8px 6px;
            font: inherit;
            font-size: clamp(15px, 4vw, 20px);
            letter-spacing: .05em;
            text-align: left;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer;
        }

        .menu button::before {
            /* 선택 커서 ▶ 자리 */
            content: "";
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 8px solid transparent;
        }

        .menu button.on::before {
            border-left-color: var(--ink);
        }

        .menu button:focus-visible {
            outline: 2px dashed var(--accent);
            outline-offset: -2px;
        }

        /* ===== 섬광 & 임시 화면 ===== */
        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
        }

        .flash.go {
            animation: flash 1.1s steps(6) forwards;
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            35% {
                opacity: .2;
            }

            50%,
            100% {
                opacity: 1;
            }
        }

        .end {
            position: absolute;
            inset: 0;
            padding: 0 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            background: var(--screen);
            color: var(--ink);
        }

        .end h1 {
            margin: 0;
            font-size: clamp(22px, 6vw, 32px);
            letter-spacing: .04em;
            text-wrap: balance;
        }

        .end p {
            margin: 0;
            font-size: 13px;
            line-height: 1.7;
            color: #5a6076;
        }

        .end button {
            font: inherit;
            font-size: 14px;
            padding: 10px 16px;
            background: var(--ink);
            color: var(--screen);
            border: 0;
            border-radius: 3px;
            cursor: pointer;
        }

        /* ===== 하단 안내 ===== */
        .pad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: var(--muted);
        }

        .pad button {
            font: inherit;
            font-size: 12px;
            color: var(--muted);
            background: none;
            border: 1px solid #3a4258;
            border-radius: 999px;
            padding: 6px 12px;
            cursor: pointer;
        }

        .pad button:focus-visible {
            outline: 2px solid var(--accent);
        }

        /* 움직임 줄이기 설정을 켠 사용자 배려 */
        @media (prefers-reduced-motion: reduce) {

            .next,
            .menu,
            .flash.go {
                animation: none;
            }

            .flash.go {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="console">
        <!-- 게임기 테두리 -->
        <div class="bezel">
            <div class="bezel-top"><span class="led"></span>ENGINEERING NIGHT · 12.03</div>

            <!-- 게임 화면: 누르면 대사 넘김 -->
            <div class="screen" id="screen" tabindex="0" role="button" aria-label="대화 넘기기">

                <!-- 캐릭터 영역 -->
                <div class="stage">
                    <div class="floor"></div>
                    <img id="charImg" alt="박사" hidden>
                    <canvas id="sprite" width="22" height="30" aria-label="박사"></canvas>
                </div>

                <!-- 대화창 -->
                <div class="dialog">
                    <p id="line" aria-live="polite">공대인인가? 잘 왔네!</p>
                    <span class="next" id="next"></span>
                </div>

                <!-- YES / NO 선택창 -->
                <div class="menu" id="menu" role="menu">
                    <button id="yes" role="menuitem" class="on">YES</button>
                    <button id="no" role="menuitem">NO</button>
                </div>

                <!-- YES 선택 시 섬광 -->
                <div class="flash" id="flash"></div>

                <!-- 홈페이지 연결 전 임시 화면 -->
                <div class="end" id="end" hidden>
                    <h1>모험을 시작하지!</h1>
                    <p>여기서 공대인의 밤 홈페이지로 이동합니다.<br>(홈페이지 연결 전 임시 화면)</p>
                    <button id="again">처음부터 다시 보기</button>
                </div>
            </div>
        </div>

        <!-- 조작 안내 + 효과음 버튼 -->
        <div class="pad">
            <span>화면을 누르거나 SPACE · ↑↓ ENTER</span>
            <button id="snd" aria-pressed="false">효과음 켜기</button>
        </div>
    </div>

</body>

</html>
