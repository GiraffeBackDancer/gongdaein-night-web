  display:flex;flex-direction:column;align-items:center;padding:18px 16px calc(28px + env(safe-area-inset-bottom));gap:16px;min-height:100vh;min-height:100dvh}
.logo{font-family:'GMB','GM',sans-serif;font-size:44px;color:#fff;-webkit-text-stroke:7px var(--navy);paint-order:stroke fill;
  text-shadow:0 5px 0 var(--navy);transform:rotate(-3deg);margin:6px 0 0;line-height:1;text-align:center}
.logo small{display:block;font-size:17px;color:var(--yellow);-webkit-text-stroke:5px var(--navy);margin-top:4px}
.talk{position:relative;width:min(440px,100%);background:#fff;border:4px solid var(--blue);border-radius:16px;padding:12px 84px 12px 16px;
  font-size:16px;line-height:1.5;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 6px #cfe2ff,0 5px 0 rgba(13,29,77,.35)}
.talk b{color:var(--blue)}
.talk img{position:absolute;right:-10px;bottom:-10px;width:76px;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(13,29,77,.35))}
.card{width:min(360px,86vw);aspect-ratio:1240/1844;border-radius:14px;background:rgba(255,255,255,.25);border:4px solid #fff;
  box-shadow:0 8px 0 var(--navy),0 18px 30px rgba(0,0,0,.35);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:cover;display:block;-webkit-touch-callout:default}
.card .wait{color:#fff;font-size:18px;-webkit-text-stroke:4px var(--navy);paint-order:stroke fill}
.btn{font-family:'GMB','GM',sans-serif;font-size:22px;width:min(360px,86vw);padding:15px 10px;border-radius:16px;border:4px solid var(--navy);
  background:var(--yellow);color:var(--navy);box-shadow:0 6px 0 var(--navy);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
.btn:disabled{opacity:.5}
.btn .arr{display:inline-block;border-style:solid;border-width:.36em 0 .36em .56em;border-color:transparent transparent transparent var(--red);
  vertical-align:middle;margin-left:8px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hint{width:min(400px,92vw);background:rgba(255,255,255,.92);border:3px solid var(--navy);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.55;text-align:center}
.hint b{color:var(--red)}
.foot{color:#fff;font-size:13px;-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;text-align:center;line-height:1.6}
[hidden]{display:none!important}
</style>

<div class="card" id="card"><span class="wait" id="wait">카드 불러오는 중…</span><img id="img" alt="트레이너 카드" hidden></div>

<button class="btn" id="save" disabled>사진 저장하기 <span class="arr"></span></button>

<div class="hint" id="hint">버튼이 안 되면 카드 사진을 <b>길게 눌러</b><br>‘사진 저장’ 또는 ‘이미지 저장’을 누르세요</div>

<div class="foot">카드는 30일 동안만 보관돼요. 지금 저장해 두세요!<br>제9대 중심 AI융합&amp;공과대학 학생회</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var img = $('img'), btn = $('save'), wait = $('wait'), talk = $('talk'), hint = $('hint');
  var FILE = 'pokeshot_card.jpg';

  // 주소 뒤 # 부분 = imgbb 이미지 경로 (예: #AbC12xy/pokeshot.jpg). imgbb 사진만 허용
  var raw = decodeURIComponent((location.hash || '').slice(1));
  var src = /^[A-Za-z0-9]+\/[A-Za-z0-9._-]+\.(jpe?g|png)$/i.test(raw) ? 'https://i.ibb.co/' + raw : '';

  function fail() {
    img.hidden = true; wait.hidden = false; wait.textContent = '카드를 찾을 수 없어요';
    talk.innerHTML = '이런… 카드를 찾지 못했다네.<br>보관 기간(30일)이 지났거나 주소가 잘못됐다네.' + talk.querySelector('img').outerHTML;
    btn.hidden = true; hint.hidden = true;
  }
  if (!src) return fail();

  img.onload = function () { wait.hidden = true; img.hidden = false; btn.disabled = false; getBlob().catch(function () {}); }; // 미리 받아둬야 아이폰 공유창이 바로 뜸
  img.onerror = fail;
  img.src = src;

  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var blob = null;
  function getBlob() {
    if (blob) return Promise.resolve(blob);
    return fetch(src, { mode: 'cors' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (b) { blob = b; return b; });
  }
  function done(msg) { btn.innerHTML = msg; setTimeout(function () { btn.innerHTML = '사진 저장하기 <span class="arr"></span>'; }, 2500); }

  function save(b) {
    var file = new File([b], FILE, { type: b.type || 'image/jpeg' });
    // 아이폰: 공유 시트 → '이미지 저장' 으로 사진 앱에 바로 저장
    if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file] }).then(function () { done('저장 완료!'); }, function () {});
    }
    // 안드로이드/PC: 파일로 내려받기 (갤러리 → Download 폴더)
    var u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = FILE; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
    done('저장 완료! 갤러리를 확인하세요');
  }
  function noSave() {
    // 바로 저장이 막힌 환경(일부 앱 안 브라우저 등): 길게 눌러 저장 안내
    hint.innerHTML = '이 브라우저에선 버튼 저장이 안 돼요.<br>카드 사진을 <b>길게 눌러</b> 저장해 주세요';
    hint.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  btn.onclick = function () {
    try { if (blob) return save(blob); } catch (e) { return noSave(); }
    btn.disabled = true;
    getBlob().then(save).catch(noSave).then(function () { btn.disabled = false; });
  };
})();
</script>
