<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>공대인의 밤 지도</title>
<style>
@font-face{font-family:"Galmuri11";src:url("fonts/Galmuri11.woff2") format("woff2");font-display:block}
@font-face{font-family:"Galmuri11";src:url("fonts/Galmuri11-Bold.woff2") format("woff2");font-weight:700;font-display:block}
:root{
  color-scheme:dark;
  --bg:#141824;--bezel:#262c3d;--ink:#1b1d2a;--box:#ffffff;--accent:#e8483c;--muted:#8a90a4;
  --pix:"Galmuri11",ui-monospace,"Apple SD Gothic Neo","Malgun Gothic",monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#fff;font-family:var(--pix);display:flex;justify-content:center;
  padding-inline:16px;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
*,*::before,*::after{box-sizing:border-box}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;padding-block:16px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.top b{font-weight:400;display:flex;align-items:center;gap:8px}
.led{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.bezel{background:var(--bezel);border-radius:14px 14px 34px 14px;padding:12px;box-shadow:0 0 0 2px #0c0f18,0 18px 40px rgba(0,0,0,.45)}
.stage{position:relative;width:100%;aspect-ratio:15/21;max-width:100%;border:3px solid #0c0f18;overflow:hidden;background:#88d070;touch-action:manipulation}
#map{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.tag{position:absolute;transform:translate(-50%,-50%);background:#fff;color:var(--ink);font-size:11px;padding:2px 7px;border:2px solid var(--ink);border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.3);pointer-events:none;white-space:nowrap}
.tag.main{background:var(--accent);color:#fff}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .26s steps(4)}
.fade.on{opacity:1}
.tag.day{background:#f4c430;color:var(--ink)}

/* 대화창 */
.dialog{position:absolute;left:3%;right:3%;bottom:2.5%;min-height:22%;background:var(--box);color:var(--ink);
  border:4px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 0 3px var(--box),inset 0 0 0 5px var(--ink);
  padding:14px 18px;display:flex;align-items:center;cursor:pointer}
#line{margin:0;font-size:clamp(13px,3.8vw,16px);line-height:1.65;word-break:keep-all}
.next{position:absolute;right:14px;bottom:10px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--accent);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* 조작부 */
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px)}
.dpad button{font:inherit;background:#2f364a;color:#c9cdd8;border:0;font-size:16px;touch-action:none;cursor:pointer}
.dpad button:active,.dpad button.on{background:#454e68;color:#fff}
.dpad .u{grid-column:2;grid-row:1;border-radius:6px 6px 0 0}
.dpad .l{grid-column:1;grid-row:2;border-radius:6px 0 0 6px}
.dpad .c{grid-column:2;grid-row:2;background:#2f364a;pointer-events:none}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 6px 6px 0}
.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 6px 6px}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.abtn{width:62px;height:62px;border-radius:50%;background:#8b2f4f;color:#fff;border:0;font:inherit;font-size:18px;box-shadow:0 4px 0 #5a1d33;cursor:pointer}
.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a1d33}
.list{font:inherit;font-size:12px;color:#c9cdd8;background:none;border:1px solid #3a4258;border-radius:999px;padding:7px 12px;cursor:pointer}
.sound{display:flex;gap:8px;justify-content:center}
.sound button{font:inherit;font-size:12px;color:#c9cdd8;background:none;border:1px solid #3a4258;border-radius:999px;padding:7px 12px;cursor:pointer}
.sound button[aria-pressed="true"]{background:#2f364a;color:#fff;border-color:#5a6480}
.hint{font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 장소 카드 · 포스터 */
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{width:100%;max-width:420px;max-height:calc(100% - 20px);overflow:auto;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:8px;
  box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--ink);padding:20px 20px 16px;animation:pop .14s steps(2)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{margin:0 0 2px;font-size:20px;font-weight:700;text-wrap:balance}
.card .sub{margin:0 0 14px;font-size:12px;color:#5a6076}
.ev{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:2px dashed #d5d8e2}
.ev .no{flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.ev.hot .no{background:var(--accent);border-color:var(--accent);color:#fff}
.ev strong{display:block;font-size:14px;font-weight:700}
.ev span{font-size:12px;color:#5a6076;line-height:1.6}
.ev button{margin-top:6px;font:inherit;font-size:12px;background:var(--accent);color:#fff;border:0;border-radius:3px;padding:6px 10px;cursor:pointer}
.when{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.when.day{background:#fff1c2;color:#8a5a00}.when.night{background:#1b2442;color:#f4c430}
.reward{display:grid;gap:8px;margin-top:12px}
.reward div{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:4px;padding:8px 10px;font-size:12px}
.reward b{font-weight:700;white-space:nowrap}.reward span{text-align:right;color:#3a3f55}
.reward .gold{background:#fff1c2}
.divider{margin:20px 0 4px;border-top:4px double var(--ink)}
.close{display:block;margin:14px 0 0 auto;font:inherit;font-size:13px;background:var(--ink);color:#fff;border:0;border-radius:3px;padding:9px 16px;cursor:pointer}

.poster{max-width:380px;padding:0;overflow:hidden;background:#1b2442;color:#fff}
.poster .hd{background:var(--accent);padding:10px 16px;font-size:11px;letter-spacing:.2em;display:flex;justify-content:space-between}
.poster .body{padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px;position:relative}
.poster .body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.poster h2{position:relative;margin:0;font-size:30px;line-height:1.15;color:#fff}
.poster h2 em{font-style:normal;color:#f4c430}
.poster .vs{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0}
.poster .vs i{width:54px;height:54px;border:3px solid #fff;border-radius:50%;display:block}
.poster .vs i:first-child{background:#e8483c}.poster .vs i:last-child{background:#3f6fc0}
.poster .vs b{font-size:22px;color:#f4c430}
.poster dl{position:relative;margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px;background:rgba(255,255,255,.08);padding:12px 14px;border-radius:4px}
.poster dt{color:#9aa3c0}.poster dd{margin:0}
.poster .tbd{color:#f4c430}
.poster .cta{position:relative;font:inherit;font-size:15px;background:#f4c430;color:var(--ink);border:0;border-radius:4px;padding:12px;cursor:pointer}
.poster .foot{position:relative;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9aa3c0}
.poster .close{margin:0;background:#fff;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.next,.card{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b><span class="led"></span>ENGINEERING NIGHT · 12.03</b><span>지도 시제품</span></div>
  <div class="bezel">
    <div class="stage" id="stage">
      <canvas id="map" width="240" height="336" aria-label="학생회관 광장 지도. 캐릭터를 움직여 건물에 들어가면 안내가 나옵니다"></canvas>
      <div id="tags"></div>
      <div class="fade" id="fade"></div>
      <div class="dialog" id="dialog" hidden><p id="line" aria-live="polite"></p><span class="next" id="next" hidden></span></div>
    </div>
  </div>
  <div class="pad">
    <div class="dpad" aria-label="방향키">
      <button class="u" data-d="up" aria-label="위">▲</button>
      <button class="l" data-d="left" aria-label="왼쪽">◀</button>
      <span class="c"></span>
      <button class="r" data-d="right" aria-label="오른쪽">▶</button>
      <button class="d" data-d="down" aria-label="아래">▼</button>
    </div>
    <div class="acts">
      <button class="abtn" id="abtn" aria-label="조사하기">A</button>
      <button class="list" id="listBtn">목록으로 보기</button>
    </div>
  </div>
  <div class="sound"><button id="sfxBtn" aria-pressed="false">효과음 켜기</button><button id="bgmBtn" aria-pressed="false">배경음악 켜기</button></div>
  <div class="hint">가고 싶은 곳을 누르면 알아서 걸어가요 · 방향키 / A 버튼 · PC는 ←↑↓→, Space</div>
</div>

<div class="overlay" id="placeOv" hidden><div class="card" id="placeCard" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="posterOv" hidden>
  <div class="card poster" role="dialog" aria-modal="true" aria-label="포켓몬 배틀 포스터">
    <div class="hd"><span>공대인의 밤 · 12.03</span><span>BATTLE</span></div>
    <div class="body">
      <h2>포켓몬 배틀<br><em>사전신청</em> 모집</h2>
      <div class="vs"><i></i><b>VS</b><i></i></div>
      <dl>
        <dt>방식</dt><dd>Pokémon Showdown 랜덤배틀</dd>
        <dt>대상</dt><dd>공과대학 재학생 <span class="tbd">(확인 필요)</span></dd>
        <dt>예선</dt><dd class="tbd">일정 추후 공지</dd>
        <dt>결승</dt><dd>12월 3일 · 대강당 무대</dd>
        <dt>신청</dt><dd class="tbd">구글폼 링크 준비 중</dd>
      </dl>
      <button class="cta" id="applyBtn">▶ 배틀 신청하기</button>
      <div class="foot"><span id="applyMsg">신청 링크가 열리면 이 버튼으로 연결돼요</span><button class="close" id="posterClose">닫기</button></div>
    </div>
  </div>
</div>

<script>
/* ===== 장소 · 행사 정보 (여기만 고치면 내용이 바뀜) ===== */
const PLACES = {
  hall: {
    name: "학생회관 5층 · 대강당", main: true,
    talk: ["학생회관이라네. 5층 대강당으로 올라가 보지!", "공대인의 밤은 모두 이 대강당에서 열린다네. 순서를 보여주지!"],
    sub: "저녁 · 대강당 · 시간은 추후 공개", badge: "저녁",
    events: [
      { t: "포켓몬 콘테스트", d: "베스트드레서를 뽑는 무대" },
      { t: "체육관 도장깨기", d: "관장(집행부)과의 대결과 미니게임" },
      { t: "포켓몬 배틀 결승", d: "사전신청 배틀의 마지막 무대", hot: true, poster: true },
      { t: "최종 경품 추첨", d: "오프닝에서 받은 응모 쪽지로 추첨" }
    ]
  },
  gym:     { name: "체육관 도장깨기", badge: "저녁", sub: "대강당 무대 왼쪽 · 시간은 추후 공개",
    talk: ["체육관 코너라네. 관장(집행부)이 도전자를 기다리고 있지!", "대결과 미니게임에서 이기면 배지를 얻을 수 있다네."],
    events: [{ t: "관장과 대결", d: "관장(집행부)과 겨루는 무대" }, { t: "미니게임", d: "게임을 깨고 배지 획득" }] },
  contest: { name: "포켓몬 콘테스트", badge: "저녁", sub: "대강당 무대 가운데 · 시간은 추후 공개",
    talk: ["무대 위 런웨이라네. 여기서 포켓몬 콘테스트가 열리지!", "베스트드레서가 되고 싶다면 멋지게 차려입고 오게!"],
    events: [{ t: "베스트드레서 뽑기", d: "포켓몬 컨셉 의상으로 런웨이에 도전" }] },
  battle:  { name: "포켓몬 배틀 결승", badge: "저녁", sub: "대강당 무대 오른쪽 · 시간은 추후 공개",
    talk: ["배틀 단상이다! 포켓몬 배틀 결승이 여기서 열린다네.", "사전신청 배틀을 뚫고 올라온 트레이너만 설 수 있지!", "승부 예측에 성공하는 트레이너는 응모권을 받을 수 있다는 점!", "승부 예측 링크는 추후에 공개된다네."],
    events: [{ t: "사전신청 배틀 결승", d: "Pokémon Showdown 랜덤배틀 · 대형 스크린 중계", hot: true, poster: true }, { t: "승부 예측", d: "결승 승자를 맞히면 포켓몬 카드(응모권) 지급 · 예측 링크는 추후 공개" }] },
  raffle:  { name: "최종 경품 추첨", badge: "저녁", sub: "대강당 · 마지막 순서",
    talk: ["경품 추첨이다! 오늘 모은 포켓몬 카드... 경품이 될 것인가?", "마지막 순서, 최종 경품 추첨을 놓치지 말게!"],
    events: [{ t: "포켓몬 카드 추첨", d: "낮 부스와 승부 예측에서 받은 포켓몬 카드(응모권)로 추첨 · 뽑힌 포켓몬 카드를 가진 사람이 당첨!" }] },
  rocket: {
    name: "로켓단 부스", badge: "낮",
    talk: ["훗, 로켓단 부스에 온 걸 환영한다!", "캠퍼스 곳곳에 'R' 오브제를 숨겨 두었지... 찾아오면 상품과 바꿔 주마!"],
    sub: "낮 부스 · 11:00–15:00 · 광장 왼쪽",
    events: [
      { t: "숨겨진 R 오브제 찾기", d: "캠퍼스 어딘가에 플라스틱 R 오브제가 숨겨져 있어요" },
      { t: "힌트는 당일 스토리로", d: "숨긴 장소 힌트를 행사 당일 인스타 스토리로 공개해요" },
      { t: "부스에 가져오면 교환", d: "찾은 R 오브제를 로켓단 부스에서 상품으로 바꿔 줘요", hot: true }
    ]
  },
  oak: {
    name: "오박사의 포켓몬 기본소양 부스", badge: "낮",
    talk: ["오박사의 포켓몬 기본소양 부스라네!", "미니게임 3개 중 2개를 깨면 응모권, 3개를 모두 깨면 모자까지 주지!"],
    sub: "낮 부스 · 11:00–15:00 · 광장 왼쪽 · 스탬프 모으기",
    events: [
      { t: "몬스터볼 던지기", d: "성공하면 스탬프 1개" },
      { t: "포켓 룰렛", d: "같은 포켓몬 2칸 이상이면 스탬프 1개" },

    note: '<div class="reward"><div><b>스탬프 2개</b><span>포켓몬 카드(응모권) 1장</span></div><div class="gold"><b>스탬프 3개</b><span>지우 모자 (선착순 50명) + 포켓몬 카드(응모권) 1장</span></div></div>'
  },
  book:  { name: "서점",       talk: ["서점이다. 전공책이 빼곡하게 꽂혀 있다...", "시험 기간이 떠올라 얼른 나왔다."] },
  optic: { name: "안경점",     talk: ["안경점이다. 반짝이는 안경테가 진열되어 있다."] },
  cu:    { name: "CU",         talk: ["편의점이다! 삼각김밥이 잔뜩 있다.", "모험 전에 간식을 챙겨 두는 것도 좋겠지."] },
  cafe:  { name: "그라찌에",   talk: ["카페 그라찌에다. 고소한 커피 향이 난다.", "대강당에 올라가기 전에 한 잔 해도 좋겠다."] }
};

/* ===== 지도: 학생회관 ㄷ자 광장 ===== */
const COLS = 15, ROWS = 21, T = 16;
let grid = Array.from({ length: ROWS }, () => Array(COLS).fill("g"));
const fill = (x0, y0, x1, y1, v) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) grid[y][x] = v; };
for (let x = 0; x < COLS; x++) grid[0][x] = "t";
for (let y = 0; y < ROWS; y++) { grid[y][0] = "t"; grid[y][COLS - 1] = "t"; }
fill(1, 1, 13, 4, "b");            // 본관 (지붕 + 남쪽 벽)
fill(1, 5, 4, 13, "b");            // 왼쪽 날개
fill(10, 5, 13, 13, "b");          // 오른쪽 날개
fill(5, 5, 9, 13, "q");            // 광장 (벽돌 바닥)
fill(1, 14, 13, 15, "q");
fill(7, 16, 7, 20, "p");
fill(1, 18, 4, 20, "t"); fill(10, 18, 13, 20, "t"); fill(1, 17, 2, 17, "t"); fill(12, 17, 13, 17, "t");
fill(4, 16, 5, 17, "f"); fill(9, 16, 10, 17, "f");
fill(5, 8, 6, 9, "x"); fill(8, 8, 9, 9, "x");   // 파라솔 테이블
[[1, 16], [13, 16]].forEach(([x, y]) => grid[y][x] = "o");
const DOORS = [
  { id: "hall",  x: 7,  y: 4,  out: [0, 1] },

function stepOut(d) { P.from = [d.x, d.y]; P.x = d.x + d.out[0]; P.y = d.y + d.out[1]; P.t = 0; P.dir = d.out[0] > 0 ? "right" : d.out[0] < 0 ? "left" : "down"; }
function enter(d) {
  if (d.id === "hall") return say(["학생회관이라네. 엘리베이터를 타고 5층 대강당으로 올라가 보지!"], () => goScene("hall", 7, 19, "up", () => {
    if (hallVisited) { lock = false; return; }
    hallVisited = true;
    say(["여기가 5층 대강당! 공대인의 밤 저녁 무대라네.", "행사는 도장깨기, 포켓몬 콘테스트, 포켓몬 배틀 결승이지.", "경품 추첨도 있으니 둘러보게. 나갈 땐 아래 출구로!"]);
  }));
  const pl = PLACES[d.id];
  say(pl.talk, () => {
    if (!pl.events) { stepOut(d); lock = false; return; }
    showPlace([d.id], () => { stepOut(d); });
  });
}
function showPlace(ids, onClose) {
  placeCard.innerHTML = ids.map(id => {
    const pl = PLACES[id];
    return `${pl.badge ? `<span class="when ${pl.badge === "낮" ? "day" : "night"}">${pl.badge}</span>` : ""}<h2>${pl.name}</h2><p class="sub">${pl.sub}</p>` + pl.events.map((e, i) =>
      `<div class="ev${e.hot ? " hot" : ""}"><div class="no">${i + 1}</div><div><strong>${e.t}</strong><span>${e.d}</span>${e.poster ? `<br><button data-poster>포스터 보기</button>` : ""}</div></div>`).join("") + (pl.note || "");
  }).join('<div class="divider"></div>') + '<button class="close" id="placeClose">닫기</button>';
  placeOv.hidden = false; lock = true; sfx.open();
  const close = () => { sfx.close(); placeOv.hidden = true; lock = false; if (onClose) onClose(); };
  document.getElementById("placeClose").onclick = close;
  placeCard.querySelectorAll("[data-poster]").forEach(b => b.onclick = () => { placeOv.hidden = true; openPoster(() => { placeOv.hidden = false; lock = true; }); });
  placeOv.onclick = e => { if (e.target === placeOv) close(); };
  document.getElementById("placeClose").focus({ preventScroll: true });
}

function openStation(id) { route = []; held = null; say(PLACES[id].talk, () => showPlace([id])); }
function leaveHall() { const d = DOORS[0]; say(["광장으로 내려가자."], () => goScene("plaza", d.x, d.y + 1, "down")); }
function openBooth(id) { route = []; held = null; say(PLACES[id].talk, () => showPlace([id])); }

/* ===== 포스터 ===== */
const posterOv = document.getElementById("posterOv");
let posterBack = null;
function openPoster(back) { sfx.fanfare(); route = []; held = null; lock = true; posterBack = back || null; posterOv.hidden = false; document.getElementById("posterClose").focus({ preventScroll: true }); }
function closePoster() { sfx.close(); posterOv.hidden = true; if (posterBack) { const f = posterBack; posterBack = null; f(); } else lock = false; }
document.getElementById("posterClose").onclick = closePoster;
posterOv.onclick = e => { if (e.target === posterOv) closePoster(); };
document.getElementById("applyBtn").onclick = () => { document.getElementById("applyMsg").textContent = "신청 링크를 준비하고 있어요. 곧 열립니다!"; };

/* ===== 조작 ===== */
document.querySelectorAll(".dpad button").forEach(btn => {
  const d = btn.dataset.d;
  btn.addEventListener("pointerdown", e => { e.preventDefault(); if (lock) return; route = []; onArrive = null; held = d; btn.classList.add("on"); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, () => { if (held === d) held = null; btn.classList.remove("on"); }));
});
function interact() {
  if (!dlg.hidden) return advance();
  if (lock) return;
  const [dx, dy] = DIRS[P.dir], nx = P.x + dx, ny = P.y + dy;
  if (grid[ny] && grid[ny][nx] === "s") openPoster();
  else if (grid[ny] && grid[ny][nx] === "k") openBooth(BOOTHS[nx]);
  else if (grid[ny] && grid[ny][nx] === "S") openStation(STATION(nx));
  else if (grid[ny] && grid[ny][nx] === "r") openStation("raffle");
  else say(["여기엔 아무것도 없는 것 같다."]);
}
document.getElementById("abtn").addEventListener("click", interact);
document.getElementById("listBtn").addEventListener("click", () => { if (!dlg.hidden) return; showPlace(["oak", "rocket", "hall"]); });
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };
document.addEventListener("keydown", e => {
  if (!posterOv.hidden || !placeOv.hidden) { if (e.key === "Escape") { if (!posterOv.hidden) closePoster(); else document.getElementById("placeClose").click(); } return; }
  if (KEYS[e.key]) { e.preventDefault(); if (!lock) { route = []; onArrive = null; held = KEYS[e.key]; } return; }
  if (e.key === " " || e.key === "Enter" || e.key === "z") { if (e.target.tagName === "BUTTON" && e.target.id !== "abtn") return; e.preventDefault(); interact(); }
});
document.addEventListener("keyup", e => { if (KEYS[e.key] === held) held = null; });

document.getElementById("sfxBtn").addEventListener("click", e => {
  unlockAudio(); sfxOn = !sfxOn; const b = e.currentTarget;
  b.textContent = sfxOn ? "효과음 끄기" : "효과음 켜기"; b.setAttribute("aria-pressed", sfxOn); sfx.open();
});
document.getElementById("bgmBtn").addEventListener("click", e => {
  unlockAudio(); bgmOn = !bgmOn; const b = e.currentTarget;
  b.textContent = bgmOn ? "배경음악 끄기" : "배경음악 켜기"; b.setAttribute("aria-pressed", bgmOn);
  if (bgmOn) bgmPlay(scene); else bgmStop();
});
document.addEventListener("visibilitychange", () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); });
// 기기가 소리를 멈춰 버렸으면(전화·알림 등) 다음 터치 때 다시 켜기
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { if (AC && (sfxOn || bgmOn) && AC.state !== "running") AC.resume(); }, true));

/* 시작 대사 */
say(["학생회관 광장에 온 걸 환영하네!", "낮 11시부터 15시까지는 광장 왼쪽 부스에서 스탬프를 모으게.", "저녁에는 가운데 입구로 들어가 5층 대강당으로! 게시판의 배틀 포스터도 꼭 보게나."], () => { lock = false; });
</script>
</body>
</html>
